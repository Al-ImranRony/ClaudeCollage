name: CI

# Development happens on `dev`; `main` is deliberately stale at the Step 00
# scaffold. Runs on every push to dev and every PR into dev or main.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests + Release build
    # The code calls iOS 26 APIs, so it needs the iOS 26 SDK or newer — which is
    # also what App Store uploads require.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail loudly rather than silently building with whatever Xcode the image
      # defaults to (the old `xcode-select … || true` did exactly that).
      - name: Select the newest released Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Unit and integration tests only. The UI suite takes hours on a hosted
      # runner; run it locally before a release (see build-and-test notes).
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Caroullage.xcodeproj \
            -scheme "Caroullage (Dev)" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -only-testing:CaroullageTests \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # The App Store build compiles DEBUG-only code out (DevelopmentHooks) and
      # optimizes whole-module; a mistake there only shows up in Release.
      - name: Release build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Caroullage.xcodeproj \
            -scheme "Caroullage" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTests.xcresult
          path: build/UnitTests.xcresult

  lint:
    name: SwiftLint (advisory)
    runs-on: macos-26
    timeout-minutes: 10
    # Advisory until the five files over the 1200-line limit are split; it
    # reports inline on the PR without failing the build.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging
