name: PR Check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true

      - name: Install XcodeGen + SwiftLint
        run: |
          brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging --strict

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Caroullage.xcodeproj \
            -scheme "Caroullage (Dev)"

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Caroullage.xcodeproj \
            -scheme "Caroullage (Dev)" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | xcpretty
