name: TestFlight

# Manual only until the Apple Developer account exists: the App Store Connect
# API key and Match secrets it needs do not exist yet, so an automatic trigger
# would fail on every push. See docs/step-06-account-gated.md. Once they do,
# consider `push: branches: [dev]` or a tag trigger.
on:
  workflow_dispatch:

concurrency:
  group: testflight-develop
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest released Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Ruby + Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decrypt Match secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          echo "MATCH_PASSWORD set: $([[ -n "$MATCH_PASSWORD" ]] && echo yes || echo no)"

      - name: Fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: bundle exec fastlane beta
