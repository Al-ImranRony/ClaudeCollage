name: Caroullage
options:
  bundleIdPrefix: com.devron
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # Phase 6.4 — the 11 day-one languages. Apple's editorial team counts
  # localization as a Featuring signal, and the String Catalog carries the
  # translations for all of them.
  knownRegions:
    - en
    - es
    - fr
    - de
    - pt-BR
    - ja
    - ko
    - zh-Hans
    - hi
    - it
    - ar
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_MODULE_VERIFIER: YES
    # Signing team. The .xcodeproj is gitignored and XcodeGen rewrites it wholesale on every
    # `xcodegen generate`, so this line is the ONLY durable home for the team — a team picked
    # by hand in Xcode's Signing pane is erased by the very next regeneration.
    #
    # CAUTION: this must be the TEAM ID, which is the signing certificate's OU — NOT the value
    # in parentheses that `security find-identity -v -p codesigning` prints. For this cert:
    #   CN=Apple Development: imranalrony@icloud.com (G9AZVLUA7S)  <- certificate ID, not a team
    #   OU=VS9574SDLX                                              <- the Team ID; this is it
    # Putting the certificate ID here makes Xcode report "No Account for Team ..." and demand a
    # manual re-selection after every regeneration. Read the real value straight off the cert:
    #   security find-certificate -c "Apple Development: <email> (<certID>)" -p \
    #     | openssl x509 -noout -subject      # the OU= field is the Team ID
    # Team IDs are not secret. Replaced by Match codesigning in Step 06.
    DEVELOPMENT_TEAM: VS9574SDLX

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

targets:
  Caroullage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Caroullage
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Caroullage/Resources
    info:
      path: Caroullage/App/Info.plist
      properties:
        CFBundleDisplayName: Caroullage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Caroullage needs access to your photos to create collages."
        NSPhotoLibraryAddUsageDescription: "Caroullage saves your finished collages to your photo library."
        NSMicrophoneUsageDescription: "Caroullage uses the microphone when recording video for your collage."
        NSCameraUsageDescription: "Caroullage uses the camera when you shoot a photo for a collage."
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devron.caroullage
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CaroullageWidgets
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - CaroullageTests
        - CaroullageUITests
      gatherCoverageData: true
      coverageTargets:
        - Caroullage

  CaroullageWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CaroullageWidgets
      # Shared with the app target: the Live Activity attributes the widget renders.
      - path: Caroullage/Core/Models/ExportActivityAttributes.swift
      # Shared with the app target: one definition of the snapshot both sides
      # encode and decode, so they can never drift apart.
      - path: Caroullage/Core/Models/WidgetSnapshot.swift
    info:
      path: CaroullageWidgets/Info.plist
      properties:
        CFBundleDisplayName: Caroullage Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devron.caroullage.widgets
        TARGETED_DEVICE_FAMILY: "1,2"

  CaroullageTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CaroullageTests
    dependencies:
      - target: Caroullage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devron.caroullage.tests
        GENERATE_INFOPLIST_FILE: YES
        # Test bundles are never distributed, so drop the "Mac (Designed for iPad)"
        # destination — that is what puts a macOS section in Signing & Capabilities and
        # the "No signing certificate 'Mac Development' found" warning in it.
        # NB SUPPORTS_MACCATALYST is already NO by default; this is the flag that matters.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  CaroullageUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CaroullageUITests
    dependencies:
      - target: Caroullage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devron.caroullage.uitests
        GENERATE_INFOPLIST_FILE: YES
        # Test bundles are never distributed, so drop the "Mac (Designed for iPad)"
        # destination — that is what puts a macOS section in Signing & Capabilities and
        # the "No signing certificate 'Mac Development' found" warning in it.
        # NB SUPPORTS_MACCATALYST is already NO by default; this is the flag that matters.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  "Caroullage (Dev)":
    build:
      targets:
        Caroullage: all
    run:
      config: Debug
      # Local StoreKit testing: purchases, renewals, and restore run against this
      # file, with no App Store Connect account involved.
      storeKitConfiguration: StoreKit/Caroullage.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Caroullage
      targets:
        - CaroullageTests
        - CaroullageUITests
    archive:
      config: Debug

  "Caroullage (Staging)":
    build:
      targets:
        Caroullage: all
    run:
      config: Staging
    test:
      config: Staging
    archive:
      config: Staging

  "Caroullage":
    build:
      targets:
        Caroullage: all
    run:
      config: Release
    test:
      config: Release
    archive:
      config: Release
