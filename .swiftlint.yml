# SwiftLint config — Caroullage
# See Step 00 for required rules.

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - force_unwrapping
  - explicit_init
  - closure_spacing
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 600
  error: 1200

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - w
    - h
    - r
    - g
    - b
    - a

type_name:
  min_length: 3
  max_length: 50

included:
  - Caroullage
  - CaroullageWidgets
  - CaroullageTests
  - CaroullageUITests

excluded:
  - build
  - DerivedData
  - .build
  - .swiftpm
  - Pods
  - "**/.DS_Store"
  - "**/*.generated.swift"

reporter: "xcode"
